name: dart_ecg
description: >
  Pure Dart port of NeuroKit2 ECG processing module.
  Provides ECG signal cleaning, R-peak detection, delineation,
  quality assessment, simulation, and full processing pipeline.
version: 0.1.1
homepage: https://github.com/mskayali/dart_ecg
repository: https://github.com/mskayali/dart_ecg
environment:
  sdk: ^3.0.0

dependencies:
  iirjdart: ^0.1.0
  fftea: ^1.5.0
  collection: ^1.18.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.0
